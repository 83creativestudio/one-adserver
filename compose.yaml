name: one-adserver
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: one_adserver
      MARIADB_USER: one_adserver
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 15
  migrate:
    build: .
    image: one-adserver:local
    environment: &database-env
      DB_PROVIDER: mariadb
      DB_HOST: db
      DB_NAME: one_adserver
      DB_USER: one_adserver
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      UPLOAD_DIR: /app/data/uploads
    command: [npm, run, db:migrate]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  app:
    image: one-adserver:local
    restart: unless-stopped
    environment:
      <<: *database-env
      APP_URL: ${APP_URL:?Set APP_URL to your HTTPS origin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DELIVERY_SECRET: ${DELIVERY_SECRET:?Set DELIVERY_SECRET}
      TRUST_PROXY: 'true'
    ports:
      - '127.0.0.1:${ADSERVER_HOST_PORT:-3017}:3000'
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  database:
  uploads:
